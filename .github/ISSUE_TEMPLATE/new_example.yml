name: New example
description: Propose an example to bundle with a framework, shown on the home screen
labels: ["enhancement", "new example"]
type: Feature
body:
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      description: Which framework is this example for?
      options:
        - Abstract Argumentation (AF)
        - Bipolar Argumentation (BAF)
        - Dialectical Argumentation (ADF)
        - Incomplete Argumentation (iAF)
        - Probabilistic Argumentation (PAF)
        - Collective Attacks (SetAF)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What does this example illustrate?
      description: Why would this be a good example to include, e.g. what concept, scenario or edge case does it showcase?
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Example content
      description: The example in plain text, or ideally in the native save file format. You can also attach an exported file instead.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional comments
    validations:
      required: false
