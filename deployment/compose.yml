services:
  agonproject:
    image: ghcr.io/aig-hagen/AgonProject:latest
    ports:
      - '8082:8080'
    environment:
      FRONTEND_URL: https://agonproject.aig.fernuni-hagen.de
      ALLOWED_ORIGIN: https://agonproject.aig.fernuni-hagen.de
      # Token guarding GET /stats. Leave unset to keep the stats readout disabled.
      STATS_TOKEN: ${STATS_TOKEN:-}
    volumes:
      - shares_data:/opt/share-server/data
    restart: unless-stopped

volumes:
  shares_data: {}
