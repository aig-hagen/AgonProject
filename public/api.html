<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>API reference &middot; AgonProject</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1.25rem;
        background: #004c97;
        color: #fff;
        font:
          600 0.95rem/1.3 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .topbar a {
        color: #fff;
        text-decoration: underline;
      }
      .topbar .spacer {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span>AgonProject reasoning API</span>
      <span class="spacer"></span>
      <a
        href="https://github.com/aig-hagen/AgonProject/blob/dev/docs/architecture/reasoning-backend-api.md"
        target="_blank"
        rel="noopener"
        >Documentation</a
      >
      <a href="/">Open the app</a>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: '/openapi.yaml',
          dom_id: '#swagger-ui',
          deepLinking: true,
          tryItOutEnabled: true,
          defaultModelsExpandDepth: 0,
        })
      }
    </script>
  </body>
</html>
