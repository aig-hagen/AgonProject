<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Under maintenance &middot; AgonProject</title>
    <style>
      :root {
        color-scheme: light dark;
        /* Standalone page: values mirror @/modules/common/theme/palette.ts. */
        --bg: #eef2f6;
        --card: #ffffff;
        --fg: #162536;
        --muted: #526475;
        --border: #dce4ec;
        --accent: #004c97;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17222c;
          --card: #1c2833;
          --fg: #e7eef4;
          --muted: #9fb0bd;
          --border: #2a3a48;
          --accent: #7ea9ce;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        line-height: 1.55;
      }
      .card {
        width: 100%;
        max-width: 30rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0.35rem 0;
        color: var(--muted);
      }
      .brand {
        margin-top: 1.75rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .brand strong {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Temporarily unavailable</h1>
      <p>AgonProject is currently down for maintenance.</p>
      <p>We&rsquo;ll be back shortly &mdash; please check again in a little while.</p>
      <p class="brand"><strong>AgonProject</strong> &middot; AIG Hagen</p>
    </main>
  </body>
</html>
