<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .prow { display: flex; align-items: center; gap: 12px; padding: 9px 4px; }
    .prow input[type=range] { flex: 1; accent-color: #5a87a8; height: 26px; }
    .val { width: 48px; text-align: right; font-size: 13px; color: #3e6a8a; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <!-- canvas behind: nodes carry probability annotations -->
  <div style="position: absolute; inset: 0; background: #ffffff;">
    <svg width="390" height="300" viewBox="0 0 390 300" style="position: absolute; top: 24px; left: 0;">
      <defs><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
      <g stroke="#5a87a8" stroke-width="2.4" marker-end="url(#ahp)" fill="none"><path d="M150 90 L118 168"/><path d="M250 175 L206 96"/></g>
      <g class="mono" font-size="16" text-anchor="middle">
        <g><circle cx="180" cy="66" r="24" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="180" y="71">a</text><text x="180" y="30" font-size="12" fill="#3e6a8a">p=1.0</text></g>
        <g><circle cx="108" cy="200" r="24" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="108" y="205">b</text><text x="108" y="240" font-size="12" fill="#3e6a8a">p=0.8</text></g>
        <g><circle cx="252" cy="200" r="24" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="252" y="205">c</text><text x="252" y="240" font-size="12" fill="#3e6a8a">p=1.0</text></g>
      </g>
    </svg>
  </div>
  <div style="position: absolute; inset: 0; background: #0000000f;"></div>

  <!-- probabilities sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 468px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;"><div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 10px 16px;">
      <span style="flex: 1; font-size: 16px; font-weight: 600;">Probabilities</span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 0 16px 8px;">
      <div style="font-size: 11px; font-weight: 700; color: #9a9aa2; letter-spacing: 0.04em; margin: 4px 0 2px;">ARGUMENTS</div>
      <div class="prow"><span class="mono" style="width: 26px;">a</span><input type="range" min="0" max="1" step="0.01" value="1"><span class="mono val">1.00</span></div>
      <div class="prow"><span class="mono" style="width: 26px;">b</span><input type="range" min="0" max="1" step="0.01" value="0.8"><span class="mono val">0.80</span></div>
      <div class="prow"><span class="mono" style="width: 26px;">c</span><input type="range" min="0" max="1" step="0.01" value="1"><span class="mono val">1.00</span></div>

      <div style="font-size: 11px; font-weight: 700; color: #9a9aa2; letter-spacing: 0.04em; margin: 14px 0 2px;">ATTACKS</div>
      <div class="prow"><span class="mono" style="width: 54px; font-size: 13px;">a → b</span><input type="range" min="0" max="1" step="0.01" value="0.6"><span class="mono val">0.60</span></div>
      <div class="prow"><span class="mono" style="width: 54px; font-size: 13px;">c → a</span><input type="range" min="0" max="1" step="0.01" value="1"><span class="mono val">1.00</span></div>
    </div>

    <div style="flex: none; padding: 10px 16px 20px; border-top: 1px solid #f0f0f2;">
      <p style="margin: 0; font-size: 12px; color: #9a9aa2; text-align: center;">Tap a node on the canvas to jump to its row</p>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
