<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .fld { display: flex; flex-direction: column; gap: 6px; }
    .fld > label { font-size: 13px; font-weight: 600; }
    .sel { display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 14px; border: 1px solid #e4e4e7; border-radius: 11px; background: #f7f7f8; font-size: 14px; }
    .num { width: 66px; height: 40px; text-align: right; border: 1px solid #e4e4e7; border-radius: 9px; background: #fff; font-size: 14px; padding: 0 10px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 58px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; background: #f7f7f8; border-bottom: 1px solid #e4e4e7;">
    <button style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="flex: 1; font-size: 18px; font-weight: 700;">Generate AF</span>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 20px;">
    <div class="fld">
      <label>Algorithm</label>
      <div class="sel">Erdős–Rényi (random)<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
    </div>

    <div class="fld">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <label>Number of arguments</label>
        <input class="num mono" value="8">
      </div>
      <input type="range" min="1" max="50" value="8" style="accent-color: #5a87a8; height: 28px;">
    </div>

    <div class="fld">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <label>Attack probability</label>
        <input class="num mono" value="0.25">
      </div>
      <input type="range" min="0" max="1" step="0.01" value="0.25" style="accent-color: #5a87a8; height: 28px;">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 0;">
      <span style="font-size: 13px; font-weight: 600;">Fixed seed</span>
      <span style="display: flex; align-items: center; gap: 10px;">
        <input class="num mono" value="42" style="width: 80px;">
        <span style="width: 46px; height: 27px; border-radius: 999px; background: #5a87a8; position: relative;"><span style="position: absolute; top: 3px; right: 3px; width: 21px; height: 21px; border-radius: 999px; background: #fff;"></span></span>
      </span>
    </div>

    <!-- last result -->
    <div style="border: 1px solid #d7e3ec; border-radius: 14px; background: #f4f8fb; padding: 12px 14px;">
      <div style="font-size: 12px; color: #7a8aa0; font-weight: 600; margin-bottom: 8px;">LAST GENERATED · 8 arguments, 14 attacks</div>
      <svg width="100%" height="120" viewBox="0 0 320 120">
        <g stroke="#5a87a8" stroke-width="1.6" fill="none"><path d="M60 40 L110 80M110 80 L180 50M180 50 L250 80M90 30 L200 30M150 95 L230 40"/></g>
        <g fill="#99b7d5" stroke="#5a87a8" stroke-width="1.3">
          <circle cx="60" cy="40" r="12"/><circle cx="110" cy="80" r="12"/><circle cx="180" cy="50" r="12"/><circle cx="250" cy="80" r="12"/><circle cx="90" cy="30" r="12"/><circle cx="200" cy="30" r="12"/><circle cx="150" cy="95" r="12"/><circle cx="230" cy="40" r="12"/>
        </g>
      </svg>
      <button style="width: 100%; height: 44px; margin-top: 8px; border-radius: 11px; border: 1px solid #d7e3ec; background: #fff; color: #3e6a8a; font-size: 14px; font-weight: 600; cursor: pointer;">Open in editor</button>
    </div>
  </div>

  <div style="flex: none; padding: 10px 16px 20px; border-top: 1px solid #f0f0f2;">
    <button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; border: none; background: #5a87a8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M13 4l2.5 6L22 12l-6.5 2L13 20l-2.5-6L4 12l6.5-2z"/></svg>
      Generate
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
