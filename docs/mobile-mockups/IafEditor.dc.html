<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .seg { display: flex; padding: 3px; background: #ffffffe8; border: 1px solid #e4e4e7; border-radius: 11px; box-shadow: 0 2px 6px #0000000f; }
    .seg > div { display: grid; place-items: center; width: 42px; height: 34px; border-radius: 8px; color: #6b6b74; cursor: pointer; }
    .seg > div.on { background: #5a87a8; color: #ffffff; }
    .caplabel { font-size: 11px; color: #8a8a92; font-weight: 600; margin: 0 0 4px 4px; }
    .bbtn { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 12px; background: #f7f7f8; border-bottom: 1px solid #e4e4e7;">
    <button style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 6px; border: 1px solid #e4e4e7; border-radius: 10px; background: #fff;">
      <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #eef2f6; color: #3e6a8a; font-size: 11px; font-weight: 700;">iAF</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start;">
        <span style="font-size: 14px; font-weight: 600; line-height: 1.15;">Uncertain args</span>
        <span style="font-size: 11px; color: #7a7a83; line-height: 1.15;">Incomplete</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 4px;">
      <button title="Undo" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.8"><path d="M7.2 7.2h9.6a4 4 0 0 1 0 8H9M7.2 7.2 10 4.5M7.2 7.2 10 10"/></svg></button>
      <button title="Menu" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>

  <div style="flex: 1; position: relative; overflow: hidden;">
    <!-- two stacked mode selectors: argument certainty + attack certainty (bottom-left) -->
    <div style="position: absolute; bottom: 12px; left: 12px; z-index: 5; display: flex; flex-direction: column; gap: 10px;">
      <div>
        <p class="caplabel">Argument</p>
        <div class="seg">
          <div class="on" title="Definite"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></div>
          <div title="Uncertain"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.2"><circle cx="12" cy="12" r="8"/></svg></div>
        </div>
      </div>
      <div>
        <p class="caplabel">Attack</p>
        <div class="seg">
          <div class="on" title="Definite"><svg width="24" height="12" viewBox="0 0 30 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7h22"/><path d="M20 3l5 4-5 4"/></svg></div>
          <div title="Uncertain"><svg width="24" height="12" viewBox="0 0 30 14" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.2"><path d="M2 7h22"/><path d="M20 3l5 4-5 4"/></svg></div>
        </div>
      </div>
    </div>

    <svg width="390" height="100%" viewBox="0 0 390 640" preserveAspectRatio="xMidYMid meet" style="position: absolute; inset: 0;">
      <defs><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
      <!-- definite attack a->b -->
      <path d="M150 180 L118 262" stroke="#5a87a8" stroke-width="2.4" marker-end="url(#ahi)" fill="none"/>
      <!-- uncertain attack c->a (dashed) -->
      <path d="M256 262 L214 184" stroke="#5a87a8" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ahi)" fill="none"/>
      <g class="mono" font-size="17" fill="#1b1b1f" text-anchor="middle">
        <g><circle cx="180" cy="155" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="180" y="161">a</text></g>
        <g><circle cx="110" cy="295" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="110" y="301">b</text></g>
        <!-- uncertain argument c: dashed outline -->
        <g><circle cx="262" cy="295" r="26" fill="#eaf1f7" stroke="#5a87a8" stroke-width="2" stroke-dasharray="5 3.5"/><text x="262" y="301">c</text></g>
      </g>
    </svg>

    <!-- tap the uncertain node c -> quick action popover -->
    <div style="position: absolute; left: 232px; top: 190px; z-index: 6;">
      <div style="background: #ffffff; border: 1px solid #e4e4e7; border-radius: 12px; box-shadow: 0 6px 20px #00000022; overflow: hidden; width: 188px;">
        <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #f0f0f2; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
          <span style="font-size: 14px; font-weight: 500;">Make definite</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/></svg>
          <span style="font-size: 14px; color: #c0392b;">Delete argument</span>
        </div>
      </div>
    </div>
  </div>

  <div style="height: 76px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 12px 12px; background: #f7f7f8; border-top: 1px solid #e4e4e7;">
    <div style="display: flex; gap: 4px;">
      <button class="bbtn" title="Fit to view"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="bbtn" title="Relayout"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.7"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 4l2.5 6L22 12l-6.5 2L13 20l-2.5-6L4 12l6.5-2z"/></svg></button>
    </div>
    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 14px; border: none; background: #5a87a8; color: #fff; font-size: 15px; font-weight: 600; box-shadow: 0 2px 8px #5a87a840;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M5 4h5l-1.5 16H6.5z" opacity="0.9"/><path d="M14 4c3 0 3 4 3 8s0 8 3 8"/></svg>Evaluate
    </button>
    <button class="bbtn" title="Export"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 3 2.5L16 11l4 4"/></svg></button>
  </div>

</div>
</x-dc>
</body>
</html>
