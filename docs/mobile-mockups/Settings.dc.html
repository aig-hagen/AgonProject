<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .cap { font-size: 11px; font-weight: 700; color: #9a9aa2; letter-spacing: 0.05em; margin: 22px 0 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 48px; }
    .row > span { font-size: 14px; }
    .toggle { width: 46px; height: 27px; border-radius: 999px; position: relative; flex: none; }
    .toggle .knob { position: absolute; top: 3px; width: 21px; height: 21px; border-radius: 999px; background: #fff; }
    .seg { display: flex; padding: 3px; background: #f0f0f2; border-radius: 9px; }
    .seg > div { padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #6b6b74; }
    .seg > div.on { background: #ffffff; color: #1b1b1f; box-shadow: 0 1px 2px #00000018; }
    .sel { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 9px; background: #f7f7f8; font-size: 14px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 58px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; background: #f7f7f8; border-bottom: 1px solid #e4e4e7;">
    <button style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span style="flex: 1; font-size: 18px; font-weight: 700;">Settings</span>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 0 18px 24px;">
    <div class="cap">APPEARANCE</div>
    <div class="row"><span>Dark mode</span><span class="toggle" style="background: #d4d4d8;"><span class="knob" style="left: 3px;"></span></span></div>
    <div class="row"><span>Graph style</span><div class="sel">Default<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div></div>

    <div class="cap">GRAPH DEFAULTS</div>
    <div class="row"><span>Physics mode</span><div class="seg"><div class="on">Off</div><div>On</div></div></div>
    <div class="row"><span>Show grid</span><div class="seg"><div class="on">Off</div><div>On drag</div><div>On</div></div></div>
    <div class="row"><span>Grid type</span><div class="seg"><div>Square</div><div class="on">Rhombus</div></div></div>
    <div class="row"><span>Grid cell size</span>
      <span style="display: flex; align-items: center; gap: 10px;">
        <input type="range" min="2" max="6" step="0.5" value="3" style="width: 120px; accent-color: #5a87a8;">
        <span style="font-size: 13px; color: #6b6b74; width: 24px; text-align: right;">3×</span>
      </span>
    </div>
    <div class="row"><span>Snap to grid</span><span class="toggle" style="background: #d4d4d8;"><span class="knob" style="left: 3px;"></span></span></div>

    <div class="cap">TUTORIALS</div>
    <div class="row"><span>Show hints</span><span class="toggle" style="background: #5a87a8;"><span class="knob" style="right: 3px;"></span></span></div>
  </div>

</div>
</x-dc>
</body>
</html>
