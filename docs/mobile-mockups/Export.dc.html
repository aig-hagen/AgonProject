<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .row { width: 100%; display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 14px; border: 1px solid #e4e4e7; border-radius: 12px; background: #ffffff; cursor: pointer; text-align: left; }
    .ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: #eef2f6; flex: none; }
    .lbl { flex: 1; display: flex; flex-direction: column; }
    .lbl b { font-size: 15px; font-weight: 600; }
    .lbl span { font-size: 12px; color: #7a7a83; }
    .tag { font-size: 11px; color: #7a8aa0; background: #eef3f7; border-radius: 6px; padding: 2px 7px; font-weight: 600; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: #fafafa;"></div>
  <div style="position: absolute; inset: 0; background: #00000014;"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 548px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 2px;">
      <div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 12px 16px;">
      <span style="flex: 1; font-size: 17px; font-weight: 600;">Export</span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 18px;">

      <!-- one-tap share stays, kept apart from the format flow -->
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-radius: 14px; border: none; background: #5a87a8; color: #ffffff; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5 15.4 6.5M8.6 13.5 15.4 17.5"/></svg>
        <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 600;">Copy share link</span>
      </button>

      <!-- IMAGE: opens a preview (config lives there) -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; font-weight: 600; color: #9a9aa2; letter-spacing: 0.03em; padding-left: 4px;">IMAGE</span>
        <button class="row">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>
          <span class="lbl"><b>SVG image</b><span>Rendered diagram — with style options</span></span>
          <span class="tag">Preview</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c0c0c6" stroke-width="2" style="margin-left: 6px;"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="row" style="opacity: 0.5; cursor: default;">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 3 2.5L16 11l4 4"/></svg></span>
          <span class="lbl"><b>PNG image</b><span>Coming soon</span></span>
        </div>
      </div>

      <!-- CODE & DATA: direct download, no options -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; font-weight: 600; color: #9a9aa2; letter-spacing: 0.03em; padding-left: 4px;">CODE &amp; DATA</span>
        <button class="row">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="1.7"><path d="M9 6 4 12l5 6M15 6l5 6-5 6"/></svg></span>
          <span class="lbl"><b>LaTeX (TikZ)</b><span>Copy code &amp; \usepackage line</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.8"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg>
        </button>
        <button class="row">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="1.7"><path d="M4 5h16v14H4z"/><path d="M8 5v14M4 9h4"/></svg></span>
          <span class="lbl"><b>ICCMA</b><span>Competition format</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.8"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg>
        </button>
        <button class="row">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="1.7"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/><path d="M9 9l6 6"/></svg></span>
          <span class="lbl"><b>TGF</b><span>Trivial graph format</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa0a8" stroke-width="1.8"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg>
        </button>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
