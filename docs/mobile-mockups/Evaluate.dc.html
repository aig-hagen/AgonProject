<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .chip { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #e4e4e7; background: #ffffff; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; flex: none; }
    .chip.on { border-color: #5a87a8; background: #eef3f7; color: #2b4d66; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <!-- Canvas behind, selected extension {a,c} highlighted green -->
  <div style="position: absolute; inset: 0; background: #ffffff;">
    <svg width="390" height="360" viewBox="0 0 390 360" style="position: absolute; top: 30px; left: 0;">
      <defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
      <g stroke="#5a87a8" stroke-width="2.4" marker-end="url(#ah3)" fill="none">
        <path d="M150 95 L118 178"/><path d="M138 220 L232 220"/><path d="M258 182 L214 98"/>
      </g>
      <g class="mono" font-size="17" text-anchor="middle">
        <g><circle cx="180" cy="70" r="26" fill="#bfe3c9" stroke="#3f9d5a" stroke-width="3"/><text x="180" y="76">a</text></g>
        <g><circle cx="110" cy="210" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6" opacity="0.5"/><text x="110" y="216" opacity="0.5">b</text></g>
        <g><circle cx="262" cy="220" r="26" fill="#bfe3c9" stroke="#3f9d5a" stroke-width="3"/><text x="262" y="226">c</text></g>
      </g>
    </svg>
  </div>
  <div style="position: absolute; inset: 0; background: #0000000d;"></div>

  <!-- Bottom sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 512px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;">
      <div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div>
    </div>

    <!-- Saved-evaluation switcher: scrollable chips, each icon = its kind -->
    <div style="display: flex; gap: 8px; padding: 6px 14px 12px; overflow-x: auto;">
      <div class="chip on">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.9"><path d="M9 4H7a2 2 0 0 0-2 2c0 3-1 4-2 4v0c1 0 2 1 2 4a2 2 0 0 0 2 2h2M15 4h2a2 2 0 0 1 2 2c0 3 1 4 2 4v0c-1 0-2 1-2 4a2 2 0 0 1-2 2h-2"/></svg>
        Grounded
      </div>
      <div class="chip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="1.9"><path d="M9 4H7a2 2 0 0 0-2 2c0 3-1 4-2 4v0c1 0 2 1 2 4a2 2 0 0 0 2 2h2M15 4h2a2 2 0 0 1 2 2c0 3 1 4 2 4v0c-1 0-2 1-2 4a2 2 0 0 1-2 2h-2"/></svg>
        Preferred
      </div>
      <div class="chip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="1.9"><path d="M11 5h10M11 12h10M11 19h10M3 7l2-2 2 2M5 5v14"/></svg>
        Categorizer
      </div>
      <div class="chip" style="width: 38px; padding: 0; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <!-- params for the active (extension) evaluation -->
    <div style="display: flex; gap: 10px; padding: 0 16px 14px;">
      <label style="flex: 2; display: flex; flex-direction: column; gap: 5px;">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7a7a83; font-weight: 500;">
          Semantics
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="1.9" style="cursor: pointer;"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </span>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 10px; background: #f7f7f8; font-size: 14px;">Grounded<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
      </label>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 12px; color: #7a7a83; font-weight: 500;">Mode</span>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 10px; background: #f7f7f8; font-size: 14px;">Enum.<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
      </label>
    </div>

    <!-- glossary definition, revealed by the ⓘ next to Semantics (collapsed by default) -->
    <div style="margin: 0 16px 14px; border: 1px solid #e2ebf1; background: #f4f8fb; border-radius: 12px; padding: 11px 13px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
        <span style="font-size: 13px; font-weight: 600; color: #2b4d66;">Grounded extension</span>
        <span style="flex: 1;"></span>
        <a title="Dung (1995) — open reference" style="display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #e6eef4; cursor: pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.7"><path d="M12 6c-2-1.3-4.5-1.5-7-1v12c2.5-.5 5-.3 7 1 2-1.3 4.5-1.5 7-1V5c-2.5-.5-5-.3-7 1z"/><path d="M12 6v13"/></svg>
        </a>
      </div>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #55555e;">The unique minimal complete extension: it accepts only arguments it can defend, and commits to as little as possible. Always exists.</p>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 0 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px;">
        <span style="font-size: 12px; color: #7a7a83;">1 extension · tap to show on canvas</span>
        <span style="font-size: 11px; color: #a0a0a8;">18&nbsp;ms</span>
      </div>
      <button style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px; margin-bottom: 8px; border: 2px solid #3f9d5a; border-radius: 12px; background: #f0faf3; cursor: pointer; text-align: left;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #3f9d5a;"></span>
        <span class="mono" style="flex: 1; font-size: 15px;">{ a, c }</span>
        <span style="font-size: 12px; color: #3f9d5a; font-weight: 600;">shown</span>
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
