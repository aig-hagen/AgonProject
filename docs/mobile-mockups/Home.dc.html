<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .badge { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 11px; background: #eef2f6; color: #3e6a8a; font-size: 12px; font-weight: 700; flex: none; }
    .doc { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 10px; border-radius: 12px; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Top bar -->
  <div style="height: 58px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 16px; border-bottom: 1px solid #eee;">
    <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">AgonProject</span>
    <button style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent; cursor: pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- Segmented control: Documents | New -->
  <div style="flex: none; padding: 14px 16px 8px;">
    <div style="display: flex; padding: 4px; background: #f0f0f2; border-radius: 12px;">
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; background: #ffffff; box-shadow: 0 1px 3px #0000001a; font-size: 14px; font-weight: 600;">Documents</div>
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 9px; font-size: 14px; font-weight: 500; color: #6b6b74;">New</div>
    </div>
  </div>

  <!-- Documents list -->
  <div style="flex: 1; overflow-y: auto; padding: 4px 8px 8px;">
    <!-- current / open doc -->
    <div class="doc" style="background: #eef3f7; border: 1px solid #d7e3ec;">
      <span class="badge" style="background: #5a87a8; color: #ffffff;">AF</span>
      <span style="flex: 1; min-width: 0;">
        <span style="display: block; font-size: 15px; font-weight: 600;">Example&nbsp;1</span>
        <span style="display: block; font-size: 12px; color: #7a7a83;">Abstract · open now</span>
      </span>
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #3f9d5a; margin-right: 8px;"></span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: none; background: transparent; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#9a9aa2"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <div class="doc">
      <span class="badge">BAF</span>
      <span style="flex: 1; min-width: 0;">
        <span style="display: block; font-size: 15px; font-weight: 600;">Support demo</span>
        <span style="display: block; font-size: 12px; color: #7a7a83;">Bipolar · edited 2h ago</span>
      </span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: none; background: transparent; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#9a9aa2"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <div class="doc">
      <span class="badge">ADF</span>
      <span style="flex: 1; min-width: 0;">
        <span style="display: block; font-size: 15px; font-weight: 600;">Conditions test</span>
        <span style="display: block; font-size: 12px; color: #7a7a83;">Dialectical · edited yesterday</span>
      </span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: none; background: transparent; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#9a9aa2"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <div class="doc">
      <span class="badge">iAF</span>
      <span style="flex: 1; min-width: 0;">
        <span style="display: block; font-size: 15px; font-weight: 600;">Uncertain args</span>
        <span style="display: block; font-size: 12px; color: #7a7a83;">Incomplete · edited 3d ago</span>
      </span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: none; background: transparent; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#9a9aa2"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
  </div>

  <!-- primary action -->
  <div style="flex: none; padding: 10px 16px calc(16px); border-top: 1px solid #f0f0f2;">
    <button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; border: none; background: #5a87a8; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>
      New document
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
