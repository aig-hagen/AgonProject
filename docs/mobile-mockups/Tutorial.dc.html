<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .bbtn { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- top bar -->
  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 12px; background: #f7f7f8; border-bottom: 1px solid #e4e4e7;">
    <button style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 6px; border: 1px solid #e4e4e7; border-radius: 10px; background: #fff;">
      <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #eef2f6; color: #3e6a8a; font-size: 11px; font-weight: 700;">AF</span>
      <span style="font-size: 14px; font-weight: 600;">Tutorial</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 4px;">
      <button title="Undo" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.8"><path d="M7.2 7.2h9.6a4 4 0 0 1 0 8H9M7.2 7.2 10 4.5M7.2 7.2 10 10"/></svg></button>
      <button title="Menu" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>

  <!-- canvas region -->
  <div style="flex: 1; position: relative; overflow: hidden;">

    <!-- tutorial card: docked below the top bar, leaves the canvas interactive -->
    <div style="position: absolute; top: 10px; left: 10px; right: 10px; z-index: 8; background: #ffffff; border: 1px solid #d7e3ec; border-radius: 16px; box-shadow: 0 6px 22px #5a87a822; padding: 13px 14px;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
        <span style="font-size: 12px; font-weight: 600; color: #7a8aa0;">Step 4 of 6</span>
        <div style="flex: 1; height: 5px; border-radius: 999px; background: #e7edf2; overflow: hidden;"><div style="width: 66%; height: 100%; background: #5a87a8;"></div></div>
        <button style="display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; border: none; background: transparent; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div style="font-size: 15px; font-weight: 600; margin-bottom: 3px;">Evaluate the framework</div>
      <p style="margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: #55555e;">Now tap <b>Evaluate</b> to compute the extensions of your argumentation framework.</p>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <button style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #6b6b74; background: none; border: none; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>Back
        </button>
        <!-- action step: waits for the user to actually tap the target -->
        <span style="display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: #3e6a8a; background: #eef3f7; padding: 7px 13px; border-radius: 999px;">
          <span style="width: 8px; height: 8px; border-radius: 999px; background: #5a87a8;"></span>
          Waiting for you…
        </span>
      </div>
    </div>

    <!-- canvas graph (still fully interactive underneath) -->
    <svg width="390" height="100%" viewBox="0 0 390 640" preserveAspectRatio="xMidYMid meet" style="position: absolute; inset: 0;">
      <defs><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
      <g stroke="#5a87a8" stroke-width="2.4" marker-end="url(#aht)" fill="none"><path d="M150 300 L118 382"/><path d="M138 424 L232 424"/><path d="M258 386 L214 306"/></g>
      <g class="mono" font-size="17" fill="#1b1b1f" text-anchor="middle">
        <g><circle cx="180" cy="275" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="180" y="281">a</text></g>
        <g><circle cx="110" cy="415" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="110" y="421">b</text></g>
        <g><circle cx="262" cy="425" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="262" y="431">c</text></g>
      </g>
    </svg>

    <!-- spotlight pointer to the highlighted target below -->
    <div style="position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; z-index: 7;">
      <svg width="26" height="30" viewBox="0 0 26 30" fill="none" stroke="#5a87a8" stroke-width="2.4"><path d="M13 3v20M6 16l7 7 7-7"/></svg>
    </div>
  </div>

  <!-- bottom command bar, with Evaluate spotlighted -->
  <div style="height: 76px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 12px 12px; background: #f7f7f8; border-top: 1px solid #e4e4e7;">
    <div style="display: flex; gap: 4px; opacity: 0.45;">
      <button class="bbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button class="bbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.7"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 4l2.5 6L22 12l-6.5 2L13 20l-2.5-6L4 12l6.5-2z"/></svg></button>
    </div>
    <!-- highlighted / spotlighted target -->
    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 14px; border: none; background: #5a87a8; color: #fff; font-size: 15px; font-weight: 600; box-shadow: 0 0 0 4px #5a87a83a, 0 0 0 9px #5a87a81f;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M5 4h5l-1.5 16H6.5z" opacity="0.9"/><path d="M14 4c3 0 3 4 3 8s0 8 3 8"/></svg>Evaluate
    </button>
    <button class="bbtn" style="opacity: 0.45;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 3 2.5L16 11l4 4"/></svg></button>
  </div>

</div>
</x-dc>
</body>
</html>
