<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Top bar: switcher (left) + menu (right) -->
  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 12px; background: #f7f7f8; border-bottom: 1px solid #e4e4e7;">
    <button style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 6px; border: 1px solid #e4e4e7; border-radius: 10px; background: #ffffff; cursor: pointer; min-width: 0;">
      <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #99b7d5;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="2"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M9.5 9.5 14.5 14.5"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; min-width: 0;">
        <span style="font-size: 14px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">Example&nbsp;1</span>
        <span style="font-size: 11px; color: #7a7a83; line-height: 1.15;">Abstract AF</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2" style="margin-left: 2px;"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 4px;">
      <button style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.8"><path d="M7.2 7.2h9.6a4 4 0 0 1 0 8H9M7.2 7.2 10 4.5M7.2 7.2 10 10"/></svg>
      </button>
      <button style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent; cursor: pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <!-- Canvas -->
  <div style="flex: 1; position: relative; background: #ffffff; overflow: hidden;">
    <!-- notification toast: docked top-center, auto-dismisses (bottom is busy with bar/sheets) -->
    <div style="position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; z-index: 9; pointer-events: none;">
      <div style="display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 999px; background: #1f2a33; color: #ffffff; font-size: 13px; font-weight: 500; box-shadow: 0 4px 16px #0000002e;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7fd39a" stroke-width="2.2"><path d="M5 12l4 4L19 7"/></svg>
        Share link copied
      </div>
    </div>
    <svg width="390" height="100%" viewBox="0 0 390 700" preserveAspectRatio="xMidYMid meet" style="position: absolute; inset: 0;">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/>
        </marker>
      </defs>
      <g stroke="#5a87a8" stroke-width="2.4" marker-end="url(#ah)" fill="none">
        <path d="M150 175 L118 258"/>
        <path d="M138 300 L232 300"/>
        <path d="M258 262 L214 178"/>
        <path d="M280 330 L268 410"/>
      </g>
      <g class="mono" font-size="17" fill="#1b1b1f" text-anchor="middle">
        <g><circle cx="180" cy="150" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="180" y="156">a</text></g>
        <g><circle cx="110" cy="290" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="110" y="296">b</text></g>
        <g><circle cx="262" cy="300" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="262" y="306">c</text></g>
        <g><circle cx="278" cy="440" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="278" y="446">d</text></g>
      </g>
    </svg>
    <!-- subtle add-node hint -->
    <div style="position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; pointer-events: none;">
      <span style="font-size: 12px; color: #a0a0a8; background: #ffffffd0; padding: 4px 12px; border-radius: 999px;">Double-tap the canvas to add an argument</span>
    </div>
  </div>

  <!-- Bottom command bar (thumb zone): Fit + Relayout | Evaluate | Export -->
  <div style="height: 76px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 12px calc(12px); background: #f7f7f8; border-top: 1px solid #e4e4e7;">
    <div style="display: flex; gap: 4px;">
      <button title="Fit to view" style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button title="Relayout" style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.7"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 4l2.5 6L22 12l-6.5 2L13 20l-2.5-6L4 12l6.5-2z"/></svg>
      </button>
    </div>

    <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 14px; border: none; background: #5a87a8; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px #5a87a840;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><path d="M5 4h5l-1.5 16H6.5z" opacity="0.9"/><path d="M14 4c3 0 3 4 3 8s0 8 3 8"/></svg>
      Evaluate
    </button>

    <button title="Export" style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 3 2.5L16 11l4 4"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
