<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .key { display: grid; place-items: center; height: 46px; border-radius: 10px; border: 1px solid #e4e4e7; background: #f7f7f8; font-size: 19px; color: #2b4d66; cursor: pointer; }
    .argchip { display: grid; place-items: center; min-width: 44px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #d7e3ec; background: #eef3f7; color: #3e6a8a; font-size: 15px; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <!-- canvas behind: node c is being edited (highlighted) -->
  <div style="position: absolute; inset: 0; background: #ffffff;">
    <svg width="390" height="320" viewBox="0 0 390 320" style="position: absolute; top: 24px; left: 0;">
      <defs><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
      <g stroke="#5a87a8" stroke-width="2.4" marker-end="url(#aha)" fill="none"><path d="M150 95 L118 178"/><path d="M258 182 L214 98"/></g>
      <g class="mono" font-size="17" text-anchor="middle">
        <g><circle cx="180" cy="70" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="180" y="76">a</text></g>
        <g><circle cx="110" cy="210" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="110" y="216">b</text></g>
        <g><circle cx="262" cy="210" r="28" fill="#cfe0ee" stroke="#3e6a8a" stroke-width="3"/><text x="262" y="216">c</text></g>
      </g>
    </svg>
  </div>
  <div style="position: absolute; inset: 0; background: #0000000f;"></div>

  <!-- condition editor sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 452px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;"><div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px 16px;">
      <span style="flex: 1; font-size: 16px; font-weight: 600;">Condition for <span class="mono">c</span></span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div style="padding: 0 16px;">
      <!-- formula input -->
      <div class="mono" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #5a87a8; border-radius: 12px; background: #ffffff; font-size: 17px; letter-spacing: 0.02em;">
        a&nbsp;∧&nbsp;¬b<span style="width: 2px; height: 22px; background: #5a87a8; margin-left: 2px; animation: none;"></span>
      </div>
      <!-- preview -->
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 8px 2px 14px;">
        <span style="font-size: 12px; color: #9a9aa2;">Preview</span>
        <span class="mono" style="font-size: 13px; color: #4a4a52;">c ← a ∧ ¬b</span>
      </div>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 0 16px;">
      <!-- argument atoms -->
      <div style="font-size: 11px; font-weight: 700; color: #9a9aa2; letter-spacing: 0.04em; margin-bottom: 6px;">ARGUMENTS</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;">
        <span class="argchip">a</span><span class="argchip">b</span><span class="argchip">c</span><span class="argchip">d</span>
      </div>
      <!-- operator keypad (mobile keyboards lack these glyphs) -->
      <div style="font-size: 11px; font-weight: 700; color: #9a9aa2; letter-spacing: 0.04em; margin-bottom: 6px;">OPERATORS</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <div class="key mono">¬</div><div class="key mono">∧</div><div class="key mono">∨</div><div class="key mono">( )</div>
        <div class="key mono">⊤</div><div class="key mono">⊥</div>
        <div class="key" style="grid-column: span 2; font-size: 15px; color: #6b6b74;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="1.9"><path d="M20 6H10a4 4 0 0 0 0 8h6M7 11l-3 3 3 3"/></svg></div>
      </div>
    </div>

    <div style="flex: none; padding: 12px 16px 20px; border-top: 1px solid #f0f0f2;">
      <button style="width: 100%; height: 50px; border-radius: 13px; border: none; background: #5a87a8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;">Done</button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
