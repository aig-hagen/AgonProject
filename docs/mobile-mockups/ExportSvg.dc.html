<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field span { font-size: 12px; color: #7a7a83; font-weight: 500; }
    .sel { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 10px; background: #f7f7f8; font-size: 14px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #fafafa; color: #1b1b1f; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: #00000014;"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;">
      <div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div>
    </div>
    <!-- header with back to the format list -->
    <div style="display: flex; align-items: center; gap: 6px; padding: 4px 8px 12px 8px;">
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span style="flex: 1; font-size: 16px; font-weight: 600;">SVG image</span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent; cursor: pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 0 16px;">
      <!-- live preview -->
      <div style="border: 1px solid #ececef; border-radius: 14px; background: #ffffff; padding: 8px; margin-bottom: 14px;">
        <svg width="100%" height="196" viewBox="0 0 340 196">
          <defs><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
          <g stroke="#5a87a8" stroke-width="2.2" marker-end="url(#ahs)" fill="none">
            <path d="M150 62 L118 120"/><path d="M138 150 L206 150"/><path d="M232 122 L188 66"/>
          </g>
          <g class="mono" font-size="15" text-anchor="middle">
            <g><circle cx="170" cy="46" r="22" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.5"/><text x="170" y="51">a</text></g>
            <g><circle cx="108" cy="150" r="22" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.5"/><text x="108" y="155">b</text></g>
            <g><circle cx="224" cy="150" r="22" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.5"/><text x="224" y="155">c</text></g>
          </g>
        </svg>
      </div>

      <!-- optional style options (collapsible; affects the image only) -->
      <div style="border: 1px solid #ececef; border-radius: 12px; overflow: hidden; margin-bottom: 8px;">
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #f7f7f8; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="1.7"><path d="M4 6h11M4 12h16M4 18h8"/><circle cx="18" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></svg>
          <span style="flex: 1; font-size: 14px; font-weight: 600;">Style options</span>
          <span style="font-size: 12px; color: #9a9aa2;">affects image</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2" style="transform: rotate(180deg);"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px;">
          <label class="field"><span>Argument style</span><div class="sel">standard<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div></label>
          <label class="field"><span>Name style</span><div class="sel">math<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div></label>
          <label class="field"><span>Attack style</span><div class="sel">standard<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div></label>
          <label class="field"><span>Node distance</span>
            <div style="display: flex; align-items: center; gap: 8px; height: 42px;">
              <input type="range" min="0.5" max="4" step="0.25" value="1.5" style="flex: 1; accent-color: #5a87a8;">
              <span class="mono" style="font-size: 13px; color: #6b6b74; width: 26px; text-align: right;">1.5</span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <!-- actions -->
    <div style="flex: none; display: flex; gap: 10px; padding: 12px 16px 20px; border-top: 1px solid #f0f0f2;">
      <button style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 13px; border: none; background: #5a87a8; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9"><path d="M12 4v11M8 11l4 4 4-4M5 19h14"/></svg>
        Download SVG
      </button>
      <button style="width: 52px; display: grid; place-items: center; height: 50px; border-radius: 13px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.7"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
