<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .iconbtn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer; flex: none; }
    .seg { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 10px; background: #f7f7f8; font-size: 14px; }
    .score { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 11px; border-radius: 9px; border: 1px solid; font-size: 13px; color: #1b1b1f; min-width: 68px; }
    .pillhead { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid #d5dee6; background: #eef3f7; cursor: pointer; }
    .pillname { flex: 1; text-align: left; font-size: 15px; font-weight: 600; color: #2b4d66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <!-- At the full detent the AF is mostly covered — accepted. Just a sliver shows. -->
  <div style="position: absolute; inset: 0; background: #ffffff;">
    <svg width="390" height="120" viewBox="0 0 390 120" style="position: absolute; top: 18px; left: 0;">
      <g class="mono" font-size="17" text-anchor="middle">
        <g><circle cx="180" cy="60" r="26" fill="#bfe3c9" stroke="#3f9d5a" stroke-width="3"/><text x="180" y="66">a</text></g>
      </g>
    </svg>
  </div>
  <div style="position: absolute; inset: 0; background: #0000000d;"></div>

  <!-- sheet at the FULL detent (~90dvh) -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;">
      <div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div>
    </div>

    <!-- ── PANE 1: the switchable saved eval (owns the canvas highlight) ── -->
    <div style="padding: 2px 14px 12px;">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <button class="pillhead">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4c-2 0-2.2 1.4-2.2 3.2 0 1.6-.6 2.8-1.8 3.3v3c1.2.5 1.8 1.7 1.8 3.3 0 1.8.2 3.2 2.2 3.2"/><path d="M15 4c2 0 2.2 1.4 2.2 3.2 0 1.6.6 2.8 1.8 3.3v3c-1.2.5-1.8 1.7-1.8 3.3 0 1.8-.2 3.2-2.2 3.2"/><circle cx="10.6" cy="12" r="1" fill="#3e6a8a" stroke="none"/><circle cx="13.4" cy="12" r="1" fill="#3e6a8a" stroke="none"/></svg>
          <span class="pillname">Grounded</span>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="iconbtn" title="Add evaluation"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="iconbtn" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div style="display: flex; gap: 10px; margin-bottom: 12px;">
        <label style="flex: 2; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11px; color: #7a7a83; font-weight: 500;">Semantics</span>
          <div class="seg">Grounded<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
        </label>
        <label style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11px; color: #7a7a83; font-weight: 500;">Mode</span>
          <div class="seg">Enum.<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
        </label>
      </div>
      <button style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid #3f9d5a; border-radius: 12px; background: #f0faf3; cursor: pointer; text-align: left;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #3f9d5a;"></span>
        <span class="mono" style="flex: 1; font-size: 15px;">{ a, c }</span>
        <span style="font-size: 12px; color: #3f9d5a; font-weight: 600;">shown</span>
      </button>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px;">
        <span style="font-size: 11px; color: #a0a0a8;">18&nbsp;ms · highlighting the canvas</span>
        <div style="display: flex; gap: 6px;">
          <button style="display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid #e4e4e7; background: #ffffff; font-size: 12px; color: #4a4a52; cursor: pointer;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="1.9"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>results</button>
          <button style="display: grid; place-items: center; width: 32px; height: 30px; border-radius: 8px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer;"><span class="mono" style="font-size: 11px; color: #4a4a52;">TeX</span></button>
        </div>
      </div>
    </div>

    <!-- ── divider: the second pane is a one-off comparison, view-only ── -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: #fafafa; border-top: 1px solid #ededf0; border-bottom: 1px solid #ededf0;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #8a8a93; text-transform: uppercase;">Compare with</span>
      <span style="flex: 1;"></span>
      <span style="font-size: 11px; color: #a0a0a8;">view only</span>
      <button class="iconbtn" style="width: 30px; height: 30px; border-radius: 8px;" title="Clear comparison"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <!-- ── PANE 2: one-off single eval (no saved list, no highlight) ── -->
    <div style="flex: 1; overflow-y: auto; padding: 12px 16px;">
      <div style="display: flex; gap: 10px; margin-bottom: 12px;">
        <label style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11px; color: #7a7a83; font-weight: 500;">Ranking semantics</span>
          <div class="seg">Categorizer<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
        </label>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div class="score" style="background: hsl(120,55%,90%); border-color: hsl(120,55%,62%);"><b style="font-weight: 600;">a</b><span class="mono" style="font-size: 11px; opacity: 0.6;">0.62</span></div>
        <div class="score" style="background: hsl(75,55%,90%); border-color: hsl(75,55%,62%);"><b style="font-weight: 600;">c</b><span class="mono" style="font-size: 11px; opacity: 0.6;">0.50</span></div>
        <div class="score" style="background: hsl(35,55%,90%); border-color: hsl(35,55%,62%);"><b style="font-weight: 600;">b</b><span class="mono" style="font-size: 11px; opacity: 0.6;">0.31</span></div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px;">
        <span style="font-size: 11px; color: #a0a0a8;">24&nbsp;ms · does not touch the canvas</span>
        <div style="display: flex; gap: 6px;">
          <button style="display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 8px; border: 1px solid #e4e4e7; background: #ffffff; font-size: 12px; color: #4a4a52; cursor: pointer;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="1.9"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>ranking</button>
          <button style="display: grid; place-items: center; width: 32px; height: 30px; border-radius: 8px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer;"><span class="mono" style="font-size: 11px; color: #4a4a52;">TeX</span></button>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
