<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer; flex: none; }
    .seg { display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 10px; background: #f7f7f8; font-size: 14px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <!-- Compact detent leaves most of the AF visible; re-fit into the band above -->
  <div style="position: absolute; inset: 0; background: #ffffff;">
    <svg width="390" height="470" viewBox="0 0 390 470" style="position: absolute; top: 60px; left: 0;">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
      <g stroke="#5a87a8" stroke-width="2.4" marker-end="url(#ah)" fill="none"><path d="M180 120 L140 235"/><path d="M165 290 L300 290"/><path d="M335 240 L263 125"/></g>
      <g class="mono" font-size="19" text-anchor="middle">
        <g><circle cx="220" cy="90" r="30" fill="#bfe3c9" stroke="#3f9d5a" stroke-width="3"/><text x="220" y="97">a</text></g>
        <g><circle cx="130" cy="285" r="30" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6" opacity="0.5"/><text x="130" y="292" opacity="0.5">b</text></g>
        <g><circle cx="330" cy="295" r="30" fill="#bfe3c9" stroke="#3f9d5a" stroke-width="3"/><text x="330" y="302">c</text></g>
      </g>
    </svg>
  </div>
  <div style="position: absolute; inset: 0; background: #0000000d;"></div>

  <!-- Bottom sheet at the COMPACT detent (~28dvh) -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 238px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;">
      <div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div>
    </div>

    <!-- compact = header-as-switcher + results ONLY. No selector row: the pill already
         names the active config (its semantics), so the pickers are folded away. -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 2px 14px 12px;">
      <button style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid #d5dee6; background: #eef3f7; cursor: pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4c-2 0-2.2 1.4-2.2 3.2 0 1.6-.6 2.8-1.8 3.3v3c1.2.5 1.8 1.7 1.8 3.3 0 1.8.2 3.2 2.2 3.2"/><path d="M15 4c2 0 2.2 1.4 2.2 3.2 0 1.6.6 2.8 1.8 3.3v3c-1.2.5-1.8 1.7-1.8 3.3 0 1.8-.2 3.2-2.2 3.2"/><circle cx="10.6" cy="12" r="1" fill="#3e6a8a" stroke="none"/><circle cx="13.4" cy="12" r="1" fill="#3e6a8a" stroke="none"/></svg>
        <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 600; color: #2b4d66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Grounded</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="iconbtn" title="Add evaluation"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="iconbtn" title="Close"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <!-- results (scroll) -->
    <div style="flex: 1; overflow-y: auto; padding: 0 16px 8px;">
      <button style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px; border: 2px solid #3f9d5a; border-radius: 12px; background: #f0faf3; cursor: pointer; text-align: left;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #3f9d5a;"></span>
        <span class="mono" style="flex: 1; font-size: 15px;">{ a, c }</span>
        <span style="font-size: 12px; color: #3f9d5a; font-weight: 600;">shown</span>
      </button>
    </div>

    <!-- copy footer stays even at compact -->
    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 14px; border-top: 1px solid #f0f0f2;">
      <span style="font-size: 12px; color: #a0a0a8;">18&nbsp;ms · tap a result to show it</span>
      <div style="display: flex; gap: 6px;">
        <button style="display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #e4e4e7; background: #ffffff; font-size: 12px; color: #4a4a52; cursor: pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="1.9"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>results</button>
        <button style="display: grid; place-items: center; width: 34px; height: 32px; border-radius: 8px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer;"><span class="mono" style="font-size: 11px; color: #4a4a52;">TeX</span></button>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
