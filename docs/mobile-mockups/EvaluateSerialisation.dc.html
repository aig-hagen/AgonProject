<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .chip { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #e4e4e7; background: #ffffff; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; flex: none; }
    .chip.on { border-color: #5a87a8; background: #eef3f7; color: #2b4d66; }
    .iconbtn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 999px; border: 1px solid #e4e4e7; background: #ffffff; cursor: pointer; flex: none; }
    .seg { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border: 1px solid #e4e4e7; border-radius: 10px; background: #f7f7f8; font-size: 14px; }
    .step { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 7px; border: 1px solid #d9dde2; background: #fbfbfc; font-size: 13px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <!-- Canvas behind: sequences mode does not highlight the graph -->
  <div style="position: absolute; inset: 0; background: #ffffff;">
    <svg width="390" height="360" viewBox="0 0 390 360" style="position: absolute; top: 30px; left: 0;">
      <defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a87a8"/></marker></defs>
      <g stroke="#5a87a8" stroke-width="2.4" marker-end="url(#ah5)" fill="none">
        <path d="M150 95 L118 178"/><path d="M138 220 L232 220"/><path d="M258 182 L214 98"/>
      </g>
      <g class="mono" font-size="17" text-anchor="middle">
        <g><circle cx="180" cy="70" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="180" y="76">a</text></g>
        <g><circle cx="110" cy="210" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="110" y="216">b</text></g>
        <g><circle cx="262" cy="220" r="26" fill="#99b7d5" stroke="#5a87a8" stroke-width="1.6"/><text x="262" y="226">c</text></g>
      </g>
    </svg>
  </div>
  <div style="position: absolute; inset: 0; background: #0000000d;"></div>

  <!-- Bottom sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;">
      <div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div>
    </div>

    <!-- switcher: extension chip + serialisation chip (active); delete + add trail -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 14px 12px; overflow-x: auto;">
      <div class="chip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4c-2 0-2.2 1.4-2.2 3.2 0 1.6-.6 2.8-1.8 3.3v3c1.2.5 1.8 1.7 1.8 3.3 0 1.8.2 3.2 2.2 3.2"/><path d="M15 4c2 0 2.2 1.4 2.2 3.2 0 1.6.6 2.8 1.8 3.3v3c-1.2.5-1.8 1.7-1.8 3.3 0 1.8-.2 3.2-2.2 3.2"/><circle cx="10.6" cy="12" r="1" fill="#6b6b74" stroke="none"/><circle cx="13.4" cy="12" r="1" fill="#6b6b74" stroke="none"/></svg>
        Grounded
      </div>
      <div class="chip on">
        <!-- serialisation kind: node → node -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M8 12h5.5"/><path d="M11.5 9.5 14 12l-2.5 2.5"/></svg>
        Serialisation
      </div>
      <div class="iconbtn" title="Delete this evaluation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c0563f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
      </div>
      <div class="iconbtn" title="Add evaluation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <!-- serialisation params: Selection (with ⓘ) full width, then Termination + Mode -->
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px 14px;">
      <label style="display: flex; flex-direction: column; gap: 5px;">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7a7a83; font-weight: 500;">
          Selection
          <span style="display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; cursor: pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a87a8" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          </span>
        </span>
        <div class="seg">Admissible sets<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
      </label>
      <div style="display: flex; gap: 10px;">
        <label style="flex: 2; display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 12px; color: #7a7a83; font-weight: 500;">Termination</span>
          <div class="seg">Unattacked<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
        </label>
        <label style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 12px; color: #7a7a83; font-weight: 500;">Mode</span>
          <div class="seg">Seq.<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
        </label>
      </div>
    </div>

    <!-- results: enumerated serialisation sequences (∅ → {a} → {a,c}) -->
    <div style="flex: 1; overflow-y: auto; padding: 0 16px;">
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
        <li style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px;">
          <span class="mono step">&#8709;</span>
          <span style="color: #a9a9b0;">&#8594;</span>
          <span class="mono step">a</span>
          <span style="color: #a9a9b0;">&#8594;</span>
          <span class="mono step">c</span>
        </li>
        <li style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px;">
          <span class="mono step">&#8709;</span>
          <span style="color: #a9a9b0;">&#8594;</span>
          <span class="mono step">c</span>
          <span style="color: #a9a9b0;">&#8594;</span>
          <span class="mono step">a</span>
        </li>
      </ol>
    </div>

    <!-- footer line: duration · count (sequences mode has no copy, matching desktop) -->
    <div style="flex: none; display: flex; align-items: center; padding: 10px 16px 16px; border-top: 1px solid #f0f0f2;">
      <span style="font-size: 12px; color: #a0a0a8;">31&nbsp;ms · 2 sequences</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
