<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #3e6a8a; } a:hover { color: #2b4d66; }
    .cap { font-size: 11px; font-weight: 700; color: #9a9aa2; letter-spacing: 0.05em; margin: 4px 2px 8px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tile { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 14px; border: 1px solid #e4e4e7; border-radius: 12px; background: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
    .tile .ico { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #eef2f6; flex: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #1b1b1f; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: #fafafa;"></div>
  <div style="position: absolute; inset: 0; background: #00000018;"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: #ffffff; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -6px 24px #00000022; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 8px 0 2px;"><div style="width: 40px; height: 5px; border-radius: 999px; background: #d4d4d8;"></div></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 12px 16px;">
      <span style="flex: 1; font-size: 17px; font-weight: 600;">Relayout</span>
      <button style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: none; background: transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 0 16px 20px;">
      <div class="cap">DIRECTED</div>
      <div class="grid" style="margin-bottom: 18px;">
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.8"><path d="M12 4v16M6 14l6 6 6-6"/></svg></span>Top → Bottom</div>
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.8"><path d="M12 20V4M6 10l6-6 6 6"/></svg></span>Bottom → Top</div>
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.8"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span>Left → Right</div>
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.8"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></span>Right → Left</div>
      </div>
      <div class="cap">OTHER</div>
      <div class="grid">
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.7"><circle cx="6" cy="7" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="17" r="2"/><path d="M7.5 8.5 11 15M16.5 7.5 13 15M8 7h8"/></svg></span>Force-directed</div>
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.7"><circle cx="7" cy="8" r="2"/><circle cx="17" cy="9" r="2"/><circle cx="10" cy="17" r="2"/><path d="M9 8h6M8.5 9.5 9 15"/></svg></span>Neato</div>
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="1.6"/><circle cx="20" cy="12" r="1.6"/><circle cx="12" cy="20" r="1.6"/><circle cx="4" cy="12" r="1.6"/></svg></span>Circular</div>
        <div class="tile"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3e6a8a" stroke-width="1.7"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="4" r="1.6"/><circle cx="19" cy="16" r="1.6"/><circle cx="5" cy="16" r="1.6"/><path d="M12 6v4M13.5 13l3 2M10.5 13l-3 2"/></svg></span>Radial</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
